name: functional-workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
    - '.github/workflows/functional-workflow.yml'
    - 'go.mod'
    - 'openstack/**workflow**'
    - 'CHANGELOG.md'
    - 'scripts/*'
  schedule:
  - cron: '0 0 * * *'
permissions:
  contents: read
jobs:
  functional-workflow:
    strategy:
      fail-fast: false
      matrix:
        name: [ "master" ]
        openstack_version: [ "master" ]
        ubuntu_version: [ "24.04" ]
        include:
        - name: "hibiscus"
          openstack_version: "stable/2026.2"
          ubuntu_version: "24.04"
        - name: "gazpacho"
          openstack_version: "stable/2026.1"
          ubuntu_version: "24.04"
        - name: "flamingo"
          openstack_version: "stable/2025.2"
          ubuntu_version: "24.04"
    runs-on: ubuntu-${{ matrix.ubuntu_version }}
    name: Mistral on OpenStack ${{ matrix.name }}
    steps:
    - name: Checkout TPO
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - name: Deploy devstack
      uses: gophercloud/devstack-action@fc61cc16ba19c4224a70b0b4d7e3e4907fac51e7 # v0.20
      with:
        branch: ${{ matrix.openstack_version }}
        conf_overrides: |
          enable_plugin mistral https://github.com/openstack/mistral ${{ matrix.openstack_version }}
        enabled_services: 'mistral,mistral-api,mistral-engine,mistral-executor,mistral-event-engine'
    - name: Checkout go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: 'go.mod'
        cache: true
    - name: Run TPO acceptance tests
      run: OS_WORKFLOW_ENVIRONMENT=true ./scripts/acceptancetest.sh
      env:
        DEVSTACK_PATH: ${{ github.workspace }}/devstack
        ACCEPTANCE_TESTS_FILTER: "workflow"
    - name: Generate logs on failure
      run: ./scripts/collectlogs.sh
      if: failure()
    - name: Upload logs artifacts on failure
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: functional-workflow-${{ matrix.name }}
        path: /tmp/devstack-logs/*
