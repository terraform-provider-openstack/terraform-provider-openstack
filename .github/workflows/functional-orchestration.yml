name: functional-orchestration
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
    - '.github/workflows/functional-orchestration.yml'
    - 'go.mod'
    - 'openstack/**orchestration**'
    - 'CHANGELOG.md'
    - 'scripts/*'
  schedule:
  - cron: '0 0 */3 * *'
permissions:
  contents: read
jobs:
  functional-orchestration:
    strategy:
      fail-fast: false
      matrix:
        name: [ "master" ]
        openstack_version: [ "master" ]
        ubuntu_version: [ "24.04" ]
        include:
        - name: "hibiscus"
          openstack_version: "stable/2026.2"
          ubuntu_version: "24.04"
        - name: "gazpacho"
          openstack_version: "stable/2026.1"
          ubuntu_version: "24.04"
        - name: "flamingo"
          openstack_version: "stable/2025.2"
          ubuntu_version: "24.04"
    runs-on: ubuntu-${{ matrix.ubuntu_version }}
    name: Heat on OpenStack ${{ matrix.name }}
    steps:
    - name: Checkout TPO
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Deploy devstack
      uses: gophercloud/devstack-action@fc61cc16ba19c4224a70b0b4d7e3e4907fac51e7 # v0.20
      with:
        branch: ${{ matrix.openstack_version }}
        conf_overrides: |
          enable_plugin heat https://github.com/openstack/heat ${{ matrix.openstack_version }}
        enabled_services: 'h-eng,h-api,h-api-cfn,h-api-cw'
    - name: Checkout go
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
      with:
        go-version-file: 'go.mod'
        cache: true
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_wrapper: false
    - name: Run TPO acceptance tests
      run: ./scripts/acceptancetest.sh
      env:
        DEVSTACK_PATH: ${{ github.workspace }}/devstack
        ACCEPTANCE_TESTS_FILTER: "orchestration"
        OS_BRANCH: ${{ matrix.openstack_version }}
    - name: Generate logs on failure
      run: ./scripts/collectlogs.sh
      if: failure()
    - name: Upload logs artifacts on failure
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: functional-orchestration-${{ matrix.name }}
        path: /tmp/devstack-logs/*
