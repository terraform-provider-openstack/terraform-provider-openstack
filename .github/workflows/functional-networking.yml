# Functional testing for networking
name: functional-networking
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request:
    paths:
    - '.github/workflows/functional-networking.yml'
    - 'go.mod'
    - 'openstack/**networking**'
    - 'CHANGELOG.md'
    - 'scripts/*'
  schedule:
  - cron: '0 0 */3 * *'
permissions:
  contents: read
jobs:
  functional-basic:
    strategy:
      fail-fast: false
      matrix:
        name: [ "master" ]
        openstack_version: [ "master" ]
        ubuntu_version: [ "24.04" ]
        include:
        - name: "hibiscus"
          openstack_version: "stable/2026.2"
          ubuntu_version: "24.04"
        - name: "gazpacho"
          openstack_version: "stable/2026.1"
          ubuntu_version: "24.04"
        - name: "flamingo"
          openstack_version: "stable/2025.2"
          ubuntu_version: "24.04"
    runs-on: ubuntu-${{ matrix.ubuntu_version }}
    name: Neutron on OpenStack ${{ matrix.name }}
    steps:
    - name: Checkout TPO
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
    - name: Create additional neutron policies
      run: |
        mkdir /tmp/neutron-policies
        cat << EOF >> /tmp/neutron-policies/port_binding.yaml
        ---
        "create_port:binding:profile": "rule:admin_only or rule:service_api"
        "update_port:binding:profile": "rule:admin_only or rule:service_api"
        EOF
    - name: Deploy devstack
      uses: gophercloud/devstack-action@fc61cc16ba19c4224a70b0b4d7e3e4907fac51e7 # v0.20
      with:
        branch: ${{ matrix.openstack_version }}
        conf_overrides: |
          Q_ML2_PLUGIN_EXT_DRIVERS=qos,port_security,dns_domain_keywords
          enable_plugin neutron-dynamic-routing https://github.com/openstack/neutron-dynamic-routing ${{ matrix.openstack_version }}

          [[post-config|\$NEUTRON_CONF]]
          [DEFAULT]
          bgp_drscheduler_driver = neutron_dynamic_routing.services.bgp.scheduler.bgp_dragent_scheduler.StaticScheduler
          [oslo_policy]
          policy_dirs = /tmp/neutron-policies
          [service_providers]
          service_provider = L3_ROUTER_NAT:user-defined:neutron.services.ovn_l3.service_providers.user_defined.UserDefined
        enabled_services: 'neutron-dhcp,neutron-dns,neutron-qos,neutron-segments,neutron-trunk,neutron-uplink-status-propagation,neutron-network-segment-range,neutron-port-forwarding,q-dr,q-dr-agent'
    - name: Checkout go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
      with:
        go-version-file: 'go.mod'
        cache: true
    - name: Run TPO acceptance tests
      run: ./scripts/acceptancetest.sh
      env:
        DEVSTACK_PATH: ${{ github.workspace }}/devstack
        ACCEPTANCE_TESTS_FILTER: "networking"
        OS_BRANCH: ${{ matrix.openstack_version }}
    - name: Generate logs on failure
      run: ./scripts/collectlogs.sh
      if: failure()
    - name: Upload logs artifacts on failure
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: functional-basic-${{ matrix.name }}
        path: /tmp/devstack-logs/*
